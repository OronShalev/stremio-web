# Stremio Web + streaming server + downloads (qBittorrent)
#
#   cp .env.example .env      # set DOWNLOADS_HOST_DIR
#   docker compose up -d --build
#   open http://localhost:8080
#
# Stop the locally installed Stremio Service and qBittorrent first - this stack
# uses the same ports (11470, 8090).

name: stremio

services:
  # The Stremio Web UI (this repo, production build)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - stremio-server
      - downloads-service

  # Stremio streaming server (torrent streaming, transcoding, subtitles)
  stremio-server:
    image: stremio/server:latest
    restart: unless-stopped
    environment:
      # Allow the web UI on http://localhost:8080 to call the server
      NO_CORS: "1"
    volumes:
      - stremio-server-data:/root/.stremio-server
    ports:
      - "127.0.0.1:11470:11470"   # streaming server (the web UI default)
      - "127.0.0.1:12470:12470"   # streaming server (https)
      # The downloads service shares this container's network (see below),
      # so its port is published here
      - "127.0.0.1:11471:11471"
    networks:
      - stremio

  # Bridge between the web UI, qBittorrent and the downloads folder
  downloads-service:
    build:
      context: ./downloads-service
    restart: unless-stopped
    # Share the streaming server's network namespace: the player plays downloaded
    # files from http://127.0.0.1:11471 and, when it needs to transcode, the
    # streaming server fetches the same URL - which must reach this service.
    network_mode: "service:stremio-server"
    environment:
      DOWNLOADS_DIR: /downloads
      DOWNLOADS_HOST_DIR: ${DOWNLOADS_HOST_DIR}
      QBITTORRENT_URL: http://qbittorrent:8090
      # Not needed: qBittorrent trusts the compose network (see docker/qbittorrent/qBittorrent.conf)
      QBITTORRENT_USERNAME: ""
      QBITTORRENT_PASSWORD: ""
    volumes:
      - ${DOWNLOADS_HOST_DIR:?Set DOWNLOADS_HOST_DIR in .env}:/downloads
    depends_on:
      - stremio-server
      - qbittorrent

  # qBittorrent with Web UI on :8090
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: "8090"
      TORRENTING_PORT: "6881"
    volumes:
      - qbittorrent-config:/config
      # Same path as in the downloads service, so the save paths it sends match
      - ${DOWNLOADS_HOST_DIR:?Set DOWNLOADS_HOST_DIR in .env}:/downloads
    ports:
      - "127.0.0.1:8090:8090"     # Web UI
      - "6881:6881"               # peers
      - "6881:6881/udp"
    depends_on:
      qbittorrent-init:
        condition: service_completed_successfully
    networks:
      - stremio

  # One-shot: seed qBittorrent's config on first start (Web UI port, save path,
  # no login needed from the compose network). Never overwrites an existing config.
  qbittorrent-init:
    image: busybox:1.36
    restart: "no"
    network_mode: none
    volumes:
      - qbittorrent-config:/config
      - ./docker/qbittorrent/qBittorrent.conf:/seed/qBittorrent.conf:ro
    command: >
      sh -c "mkdir -p /config/qBittorrent &&
             if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then
               cp /seed/qBittorrent.conf /config/qBittorrent/qBittorrent.conf && echo 'qBittorrent config seeded';
             else
               echo 'qBittorrent config exists - leaving it alone';
             fi"

networks:
  stremio:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  stremio-server-data:
  qbittorrent-config:
